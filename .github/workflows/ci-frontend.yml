# Generado por AI IT Framework (Generar código).
# Compila el código generado en cada push a sus ramas. Para usar uno propio, agrégalo como archivo fijo
# de la arquitectura en .github/workflows/ y este deja de generarse.
name: CI frontend

on:
  push:
    branches:
      - "ai/codegen-frontend-**"
  workflow_dispatch:

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          elif [ -f tsconfig.json ]; then
            npx -p typescript tsc --noEmit
          elif [ -n "$(find . -path ./node_modules -prune -o -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print -quit)" ]; then
            find . -path ./node_modules -prune -o -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 | xargs -0 -n 1 node --check
          else
            echo "::error::No hay script build, tsconfig.json ni archivos .js: no hay qué compilar"
            exit 1
          fi
