@if (currentUser.isAuthenticated()) {
  <button type="button" class="skip-link" (click)="scrollTo('contenido')" [attr.aria-current]="activeSection() === 'contenido' ? 'location' : null">Ir al contenido</button>
  <div class="app-shell">
    <app-side-nav />
    <div class="app-workspace">
      <app-header />
      <main id="contenido" class="app-content" tabindex="-1">
        <router-outlet />
      </main>
      <app-footer />
    </div>
  </div>
} @else {
  <router-outlet />
}
