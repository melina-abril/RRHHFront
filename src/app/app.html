@if (currentUser.isAuthenticated()) {
  <a class="skip-link" href="#contenido">Ir al contenido</a>
  <div class="app-shell">
    <app-side-nav />
    <div class="app-shell__main">
      <app-header />
      <main id="contenido" class="app-content" tabindex="-1">
        <router-outlet />
      </main>
    </div>
  </div>
} @else {
  <router-outlet />
}
