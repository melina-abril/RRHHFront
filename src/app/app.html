@if (currentUser.isAuthenticated()) {
  <button class="skip-link" type="button" (click)="content.focus()">Ir al contenido</button>
  <div class="app-shell">
    <app-side-nav />
    <div class="app-work">
      <app-header />
      <main #content id="contenido" class="app-content" tabindex="-1">
        <router-outlet />
      </main>
      <app-footer />
    </div>
  </div>
} @else {
  <router-outlet />
}
